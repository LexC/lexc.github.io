[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lex-portfolio"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "Frozen-Flask>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "Pillow>=13,<14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio = [
    "templates/**/*.html", "static/css/*.css", "static/js/*.js",
    "static/images/**/*.webp", "static/images/*.webp", "static/images/*.jpg",
    "static/*.svg", "static/*.ico", "static/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
