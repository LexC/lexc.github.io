<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbfbf8">
  <meta name="description" content="{{ (this.summary or 'Alex Carvalho — physics, scientific computing, and software engineering.')|striptags|e }}">
  <meta property="og:title" content="{{ this.title|e }} · Alex Carvalho">
  <meta property="og:description" content="{{ (this.summary or 'Scientific thinking. Engineering execution.')|striptags|e }}">
  <meta property="og:type" content="website">
  <title>{% block title %}{{ this.title }} · Alex Carvalho{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/static/css/site.css'|url }}">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="site-shell">
    <header class="site-header" x-data="{ open: false }">
      <a href="{{ '/'|url }}" class="wordmark" aria-label="Alex Carvalho, home"><span class="wordmark-symbol">AC<span class="heat-dot">.</span></span><span class="wordmark-label">Alex Carvalho</span></a>
      <button class="menu-toggle" type="button" x-on:click="open = !open" x-bind:aria-expanded="open.toString()" aria-controls="primary-nav" aria-label="Toggle menu"><span></span><span></span></button>
      <nav id="primary-nav" class="primary-nav" x-bind:class="{ 'is-open': open }" aria-label="Primary navigation">
        <a href="{{ '/about/'|url }}" {% if this._path == '/about' %}aria-current="page"{% endif %}>About</a>
        <a href="{{ '/research/'|url }}" {% if this._path == '/research' %}aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/engineering/'|url }}" {% if this._path == '/engineering' %}aria-current="page"{% endif %}>Engineering</a>
        <a class="nav-contact" href="{{ '/contact/'|url }}">Let's connect <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <div class="footer-top"><span class="footer-mark">AC<span class="heat-dot">.</span></span><span>Science, software, and everything in between.</span></div>
      <div class="footer-bottom"><span>© {{ 2026 }} Alex Carvalho</span><span>Built thoughtfully with Python &amp; Lektor.</span><a href="https://github.com/LexC" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
    </footer>
  </div>
</body>
</html>
