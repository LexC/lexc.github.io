name: Validate Lektor website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-package-lock
      - run: npm run css:build
      - run: lektor build --output-path dist
      - name: Check generated site
        run: |
          test -s dist/index.html
          test -s dist/css/site.css
          test -s dist/about/index.html
          test -s dist/research/index.html
          test -s dist/engineering/index.html
          test -s dist/contact/index.html
# Publication deliberately disabled during private development.
# Restore a Pages deployment job only when the site is ready to launch.
