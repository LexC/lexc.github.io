name: Validate Flask portfolio (publishing disabled)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install --no-package-lock
      - run: npm run css:build
      - run: python -m pytest -q
      - run: python freeze.py
      - name: Check generated static site
        run: |
          test -s dist/index.html
          test -s dist/static/css/site.css
          test -s dist/static/js/site.js
          grep -q 'id="projects"' dist/index.html
          grep -q 'Scientific thinking' dist/index.html
# Deliberately no GitHub Pages deployment job.
# The public site stays unpublished until explicitly launched.
