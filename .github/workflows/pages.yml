name: Validate Flask portfolio (publishing disabled)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements/development.lock
      - run: python -m pip install -e . --no-deps
      - run: npm ci
      - run: python scripts/build.py
      - run: python -m pytest -q
# Deliberately no GitHub Pages deployment job.
# The public site stays unpublished until explicitly launched.
