<section class="content-section section-wrap" id="expertise" aria-labelledby="expertise-heading">
  <div class="section-ident"><span class="section-index">05</span>
    <h2 id="expertise-heading">Expertise</h2>
  </div>
  <div class="section-body expertise-grid">
    {% for category in expertise_categories %}<article class="expertise-card">
      <h3>{{ category.name }}</h3>
      <p>{{ category.detail }}</p>
      <ul class="keyword-list" aria-label="{{ category.name }} keywords">{% for keyword in category.keywords %}<li>{{ keyword }}</li>{% endfor %}</ul>
    </article>{% endfor %}
  </div>
</section>
