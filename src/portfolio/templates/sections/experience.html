<section class="content-section section-wrap" id="experience" aria-labelledby="experience-heading">
  <div class="section-ident"><span class="section-index">02</span>
    <h2 id="experience-heading">Experience</h2>
  </div>
  <div class="section-body">
    <p class="section-lead">{{ profile.experience_intro }}</p>
    <div class="timeline">{% for stage in experience %}<article class="timeline-item"><span class="timeline-dot"></span>
        <h3>{{ stage.title }}</h3>
        <p>{{ stage.detail }}</p>
      </article>{% endfor %}</div>
  </div>
</section>
