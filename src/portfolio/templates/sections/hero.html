<section class="hero section-wrap" aria-labelledby="hero-heading">
  <div class="hero-content">
    <p class="eyebrow">{{ profile.eyebrow }}</p>
    <h1 id="hero-heading">{{ profile.name }}</h1>
    <h2>{{ profile.headline }}<br><span class="accent-text">{{ profile.headline_accent }}</span></h2>
    <div class="hero-credentials">
      <p class="hero-credentials-title">
        {% for role in profile.credentials %}<span>{{ role }}</span>{{ " " if not loop.last }}{% endfor %}
      </p>
      <p class="hero-credentials-detail">{{ profile.python_experience }}</p>
    </div>
    <div class="actions"><a class="button button-primary" href="#projects">Explore my work <span aria-hidden="true">↗</span></a><a class="button button-secondary" href="#contact">Get in touch</a>
    </div>
  </div>
  <div class="hero-art">
    <svg class="portrait-composition" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="portrait-title portrait-description">
      <title id="portrait-title">Alex Carvalho</title>
      <desc id="portrait-description">Alex smiling outdoors, framed by two clean cyan outlines.</desc>
      <defs>
        <path id="portrait-outline" d="M 175 40 H 642 Q 690 40 680 86 L 568 566 Q 558 610 514 610 H 62 Q 14 610 24 566 L 126 86 Q 136 40 175 40 Z"/>
        <clipPath id="portrait-window"><use href="#portrait-outline"/></clipPath>
        <linearGradient id="portrait-edge-blend">
          <stop offset="0" stop-color="white" stop-opacity="0"/>
          <stop offset=".06" stop-color="white"/>
          <stop offset=".94" stop-color="white"/>
          <stop offset="1" stop-color="white" stop-opacity="0"/>
        </linearGradient>
        <mask id="portrait-blend" maskUnits="userSpaceOnUse" x="50" y="20" width="600" height="592">
          <rect x="50" y="20" width="600" height="592" fill="url(#portrait-edge-blend)"/>
        </mask>
      </defs>
      <use class="portrait-back-outline" href="#portrait-outline" transform="translate(19 -20)"/>
      <g clip-path="url(#portrait-window)">
        <image href="{{ url_for('assets', filename='IMG-2026117_ed.png') }}" x="20" y="0" width="660" height="612" preserveAspectRatio="xMidYMin slice"/>
        <image href="{{ url_for('assets', filename='IMG-2026117_ed.png') }}" x="50" y="20" width="600" height="592" preserveAspectRatio="xMidYMin slice" mask="url(#portrait-blend)"/>
      </g>
      <use class="portrait-front-outline" href="#portrait-outline"/>
    </svg>
  </div>
  <a class="scroll-hint" href="#about" aria-label="Scroll to About"><svg width="28" height="18" viewBox="0 0 28 18" aria-hidden="true"><path d="m3 4 11 11L25 4" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
</section>
