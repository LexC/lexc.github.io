<section class="content-section section-wrap" id="research" aria-labelledby="research-heading">
  <div class="section-ident"><span class="section-index">03</span>
    <h2 id="research-heading">Research</h2>
    <p>{{ profile.research_intro }}</p>
  </div>
  <div class="section-body">
    <div class="research-panel">
      <div class="research-contour" aria-hidden="true">
      </div>
      <div>
        <p class="panel-kicker">{{ research.kicker }}</p>
        <h3>{{ research.headline }}</h3>
        <p>{{ research.description }}</p><span class="muted-note">{{ research.note }}</span>
      </div>
    </div>
  </div>
</section>
